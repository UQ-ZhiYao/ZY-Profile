<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ng Zhi Yao</title>
  <meta name="description" content="Ng Zhi Yao — financial mathematics, actuarial science and investing. Works, hobbies and stories."/>
  <link rel="canonical" href="https://zy-profile.com/"/>
  <meta name="theme-color" content="#ffffff"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><text x='16' y='21' font-family='Arial,sans-serif' font-weight='800' font-size='13' fill='white' text-anchor='middle'>ZY</text></svg>"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div id="boot" class="boot"><div class="spinner"></div></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="nav-pill">
      <a href="#/" class="brand" id="brand" aria-label="Home"></a>
      <nav class="nav" aria-label="Main">
        <ul id="navCats" class="nav-cats"></ul>
      </nav>
      <button class="btn btn-red btn-sm" id="authBtn" type="button">Member sign in</button>
    </div>
    <div class="side-pill">
      <button class="pill-btn" id="resumeBtn" type="button" hidden></button>
      <button class="pill-btn menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main"></main>
<footer id="footer" class="footer"></footer>

<!-- Member sign-in (only needed for members-only categories such as Stories) -->
<div id="signin" class="modal-wrap" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="siName">
    <button class="modal-x" data-close-signin aria-label="Close">✕</button>
    <div class="si-brand">
      <img id="siLogo" class="si-logo" alt="" hidden/>
      <div><div class="si-kicker">Members</div><div id="siName" class="si-name">Ng Zhi Yao</div></div>
    </div>
    <p id="siTagline" class="si-tagline"></p>
    <form id="signinForm" class="form" autocomplete="on">
      <label>Username<input name="username" required autocomplete="username" autocapitalize="none" spellcheck="false"/></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"/></label>
      <label class="check"><input type="checkbox" name="remember"/> Keep me signed in on this device</label>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      <div id="signinMsg" class="form-msg" role="status" aria-live="polite"></div>
      <div class="si-links">
        <a data-request hidden>Request access</a>
        <span>Forgot your password? Contact the site owner.</span>
      </div>
    </form>
  </div>
</div>

<script src="crypto.js"></script>
<script src="globe-data.js" defer></script>
<script src="globe.js" defer></script>
<script src="pixel.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
